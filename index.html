<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 네 가지 과제</title>

  <!-- 폰트: Fraunces(제목), IBM Plex Mono(라벨) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 배경 질감 -->
  <div class="grain" aria-hidden="true"></div>

  <!-- 소개 -->
  <header class="intro">
    <p class="kicker">P5.js_비주얼포트폴리오</p>
    <h1 class="title">p5.js 네 가지 과제</h1>
    <p class="subtitle">
      강의에서 만든 과제 네 가지입니다.<br>
      왼쪽은 기본 버전, 오른쪽은 움직이는 버전입니다.
    </p>
  </header>

  <!-- 열 라벨 (왼쪽: 정적 / 오른쪽: 동적) -->
  <div class="col-labels">
    <span class="col-label">STATIC</span>
    <span class="col-label">MOTION</span>
  </div>

  <!-- 2x2 그리드 (과제1 | 과제4 / 과제2 | 과제3) -->
  <main id="gallery">

    <!-- 과제 1: 추상화 (정적) -->
    <figure class="piece" style="--i:0">
      <div class="stage">
        <iframe src="sample1/index.html" title="과제 1 추상화" loading="lazy"></iframe>
      </div>
      <figcaption class="placard">
        <span class="no">No.01</span>
        <span class="name">추상화</span>
      </figcaption>
    </figure>

    <!-- 과제 4: 시간의 추상화 (동적, 과제1 기반) -->
    <figure class="piece" style="--i:1">
      <div class="stage">
        <iframe src="sample4/index.html" title="과제 4 움직이는 추상화" loading="lazy"></iframe>
      </div>
      <figcaption class="placard">
        <span class="no">No.04</span>
        <span class="name">움직이는 추상화</span>
      </figcaption>
    </figure>

    <!-- 과제 2: 캐릭터 (정적) -->
    <figure class="piece" style="--i:2">
      <div class="stage">
        <iframe src="sample2/index.html" title="과제 2 캐릭터" loading="lazy"></iframe>
      </div>
      <figcaption class="placard">
        <span class="no">No.02</span>
        <span class="name">캐릭터</span>
      </figcaption>
    </figure>

    <!-- 과제 3: 움직이는 캐릭터 (동적, 과제2 기반). 클릭 후 1/2/3 키, 3번은 마우스 사용 -->
    <figure class="piece piece--interactive" style="--i:3">
      <div class="stage">
        <iframe src="sample3/index.html" title="과제 3 움직이는 캐릭터" loading="lazy"></iframe>
        <span class="hint">클릭 후 조작</span>
      </div>
      <figcaption class="placard">
        <span class="no">No.03</span>
        <span class="name">움직이는 캐릭터</span>
        <span class="controls">
          <kbd>1</kbd> 기본 <kbd>2</kbd> 소등 <kbd>3</kbd> 손전등(마우스)
        </span>
      </figcaption>
    </figure>

  </main>

  <footer class="foot">
    <span>made with p5.js</span>
  </footer>

</body>
</html>
